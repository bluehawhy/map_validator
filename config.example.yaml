# Windows 창 제목에서 매칭할 일부 문자열
windows:
  work_title: "HD_3D Tool"
  roadview_title: "NLadybugSv"
  # 입력 교차로 타이틀
  intersection_review_title: "교차로 선형 검수"
  open_button_image: "assets/open_roadview.png"

preparation:
  # 분석 작업에서만 로드뷰 스크롤 사용. 입력도구 Zoom 자동 조작은 하지 않음.
  roadview_scroll_to_bottom: true

capture:
  # 창 기준 [left, top, width, height]. null이면 창 전체 캡처
  region: null
  settle_seconds: 1.5

movement:
  forward_key: "w"
  backward_key: "s"
  hold_seconds: 0.5
  max_steps: 5

analysis:
  model_name: "nvidia/segformer-b0-finetuned-ade-512-512"
  # 실무 적용 전 검증 필요
  side_road_score_threshold: 0.19
  vertical_range: [0.28, 0.60]

ui:
  opacity: 0.92

output:
  # 상대 경로는 프로젝트 폴더 기준. Windows 절대 경로도 사용 가능
  directory: "results"
