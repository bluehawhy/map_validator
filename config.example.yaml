# Windows 창 제목에서 매칭할 일부 문자열
windows:
  work_title: "HD_3D Tool"
  roadview_title: "NLadybugSv"
  # 입력 교차로 타이틀
  intersection_review_title: "교차로 선형 검수"
  open_button_image: "assets/open_roadview.png"

preparation:
  # 분석 작업에서만 로드뷰 스크롤 사용. 입력도구 Zoom 자동 조작은 하지 않음.
  roadview_scroll_to_bottom: true

capture:
  # 창 기준 [left, top, width, height]. null이면 창 전체 캡처
  region: null
  settle_seconds: 1.5

movement:
  forward_key: "w"
  backward_key: "s"
  hold_seconds: 0.5
  max_steps: 5

analysis:
  model_name: "nvidia/segformer-b0-finetuned-ade-512-512"
  # 실무 적용 전 검증 필요
  side_road_score_threshold: 0.19
  vertical_range: [0.28, 0.60]
  # 로드뷰 실제 정지선 단독 검출 신뢰도 기준(0.35~0.95).
  # 횡단보도 반복 무늬는 제외하며, 불명확한 경우 REVIEW 처리.
  stop_line_roadview_threshold: 0.68
  # 입력툴 노란 중앙선 2차 끝점 반복 병합 조건. 설정(⚙)에서 변경 가능.
  # 1차 그룹화는 8°/5px/12px 고정. 정지선 및 흰선에는 영향 없음.
  # 기존 max_gap_px 키는 호환 유지. 2차에서 CG 끝점 XY 직선거리(px).
  center_line_grouping:
    angle_tolerance_deg: 8.0
    perpendicular_tolerance_px: 5.0
    max_gap_px: 20.0

ui:
  opacity: 0.92

output:
  # 상대 경로는 프로젝트 폴더 기준. Windows 절대 경로도 사용 가능
  directory: "results"
